<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>図形・単位の冒険 / Shape & Measurement Adventure</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=MURECHO:wght@500;700;900&display=swap" rel="stylesheet">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Fredoka', 'MURECHO', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      background-color: #f0f4f8;
      overflow-x: hidden;
    }
    
    .bg-grid {
      background-size: 24px 24px;
      background-image: radial-gradient(circle, #cbd5e1 1.5px, transparent 1.5px);
    }

    .card-shadow {
      box-shadow: 0 8px 0px rgba(0,0,0,0.12);
    }

    .btn-bounce:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0px rgba(0,0,0,0.12);
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.6)); }
      50% { transform: scale(1.04); filter: drop-shadow(0 0 16px rgba(16, 185, 129, 0.9)); }
    }

    .pulse-glow {
      animation: pulseGlow 1.8s infinite ease-in-out;
    }

    @keyframes fingerTap {
      0% { transform: translate(0, 0) scale(1); opacity: 0; }
      20% { transform: translate(0, 0) scale(1); opacity: 1; }
      40% { transform: translate(var(--dx, 20px), var(--dy, 20px)) scale(0.85); opacity: 1; }
      70% { transform: translate(var(--dx, 20px), var(--dy, 20px)) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx, 20px), var(--dy, 20px)) scale(0); opacity: 0; }
    }

    .anim-hand {
      animation: fingerTap 2.5s infinite ease-in-out;
    }

    @keyframes slideCut {
      0% { transform: translateX(0); }
      50% { transform: translateX(90px); }
      100% { transform: translateX(90px); }
    }
    .anim-slide-cut {
      animation: slideCut 3s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800">

  <!-- Header Navigation -->
  <header class="bg-indigo-600 text-white p-3 sm:p-4 shadow-lg sticky top-0 z-40">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      
      <!-- Logo / Home -->
      <div onclick="showCategoryMenu()" class="flex items-center gap-3 cursor-pointer group">
        <div class="w-11 h-11 bg-amber-400 text-indigo-950 rounded-2xl flex items-center justify-center font-bold text-2xl shadow-md group-hover:scale-105 transition">
          <i class="fa-solid fa-shapes"></i>
        </div>
        <div>
          <h1 class="text-lg sm:text-2xl font-bold leading-none">図形・単位の冒険</h1>
          <p class="text-xs text-indigo-200 mt-0.5">Shape & Measurement Adventure</p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2 sm:gap-3">
        <button id="soundToggleBtn" onclick="toggleSound()" class="w-10 h-10 bg-indigo-500 hover:bg-indigo-400 rounded-2xl flex items-center justify-center text-white text-lg transition btn-bounce shadow">
          <i id="soundIcon" class="fa-solid fa-volume-high"></i>
        </button>

        <div class="flex items-center bg-amber-400 text-indigo-950 px-3.5 py-1.5 rounded-2xl font-bold text-lg shadow border-2 border-amber-300">
          <i class="fa-solid fa-star text-amber-600 mr-1.5 text-xl"></i>
          <span id="globalStars">0</span>
        </div>

        <button onclick="showCategoryMenu()" class="w-10 h-10 bg-indigo-500 hover:bg-indigo-400 rounded-2xl flex items-center justify-center text-white text-lg transition btn-bounce shadow">
          <i class="fa-solid fa-house"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto w-full p-3 sm:p-5 flex-grow flex flex-col justify-center">

    <!-- 1. CATEGORY MENU SCREEN -->
    <div id="categoryMenu" class="w-full">
      <div class="text-center mb-6">
        <div class="inline-flex items-center gap-2 bg-white px-6 py-2.5 rounded-full shadow border border-slate-200">
          <span class="text-2xl">🗺️</span>
          <span class="text-lg sm:text-xl font-black text-indigo-900">カテゴリーをえらぼう (12 Topics)</span>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Cards generated by JS -->
      </div>
    </div>

    <!-- 2. STAGE SELECTION SCREEN -->
    <div id="stageSelectScreen" class="hidden w-full flex-col items-center">
      <div class="bg-white rounded-3xl p-6 shadow-xl w-full max-w-lg border-2 border-slate-200 text-center">
        <div id="selectedCategoryTitle" class="text-2xl font-black text-indigo-900 mb-2">---</div>
        <p class="text-xs font-bold text-slate-400 mb-6">ステージをえらぼう (Select Stage)</p>

        <div id="stageButtonsContainer" class="flex flex-col gap-3">
          <!-- Stage Buttons -->
        </div>

        <button onclick="showCategoryMenu()" class="mt-6 bg-slate-200 hover:bg-slate-300 text-slate-700 px-6 py-2.5 rounded-2xl font-bold text-sm btn-bounce">
          <i class="fa-solid fa-arrow-left mr-2"></i>もどる
        </button>
      </div>
    </div>

    <!-- 3. ANIMATED TUTORIAL DEMO MODAL -->
    <div id="tutorialModal" class="hidden fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
      <div class="bg-white rounded-3xl p-5 sm:p-7 max-w-lg w-full shadow-2xl flex flex-col items-center text-center border-4 border-indigo-500 relative overflow-hidden">
        
        <div class="bg-indigo-100 text-indigo-800 px-4 py-1 rounded-full text-xs font-black tracking-wider uppercase mb-3 flex items-center gap-1.5">
          <i class="fa-solid fa-play-circle text-indigo-600 text-base"></i>
          <span>やりかた (HOW TO PLAY)</span>
        </div>

        <!-- Visual Animated Demo Container -->
        <div id="tutorialAnimBox" class="w-full h-56 sm:h-64 bg-slate-50 rounded-2xl border-2 border-dashed border-indigo-200 flex items-center justify-center relative overflow-hidden my-2 bg-grid p-2">
          <!-- Animation SVG/HTML injected dynamically -->
        </div>

        <button onclick="startActualQuiz()" class="mt-4 w-full bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold text-xl py-4 rounded-2xl shadow-lg pulse-glow flex items-center justify-center gap-3 transition btn-bounce">
          <span>つぎへ (PLAY)</span>
          <i class="fa-solid fa-circle-arrow-right text-2xl"></i>
        </button>

      </div>
    </div>

    <!-- 4. ACTUAL QUIZ SCREEN -->
    <div id="quizScreen" class="hidden w-full flex-col items-center">

      <!-- Quiz Top Bar -->
      <div class="w-full bg-white rounded-2xl p-3 shadow mb-4 flex items-center justify-between border border-slate-200">
        <button onclick="exitQuizToStageSelect()" class="w-10 h-10 bg-slate-100 text-slate-600 rounded-xl flex items-center justify-center text-lg btn-bounce">
          <i class="fa-solid fa-xmark"></i>
        </button>

        <div id="quizProgressDots" class="flex items-center gap-1.5">
          <!-- 10 dots -->
        </div>

        <div class="text-amber-500 font-extrabold text-lg flex items-center gap-1">
          <i class="fa-solid fa-trophy text-amber-400"></i>
          <span id="currentQuizScore">0/10</span>
        </div>
      </div>

      <!-- Question Playground Area -->
      <div id="quizBoard" class="w-full bg-white rounded-3xl p-4 sm:p-6 shadow-xl border-2 border-slate-200 min-h-[420px] flex flex-col items-center justify-center relative overflow-hidden bg-grid">
        <div id="questionContainer" class="w-full flex flex-col items-center justify-center">
          <!-- Questions dynamically injected per type -->
        </div>
      </div>

    </div>

  </main>

  <!-- Audio Synthesis & Interactive Game Logic -->
  <script>
    let soundEnabled = true;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.2) {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playCorrectSound() {
      if (!soundEnabled) return;
      playTone(523.25, 'sine', 0.1, 0.2); // C5
      setTimeout(() => playTone(659.25, 'sine', 0.1, 0.2), 80); // E5
      setTimeout(() => playTone(783.99, 'sine', 0.18, 0.25), 160); // G5
    }

    function playWrongSound() {
      if (!soundEnabled) return;
      playTone(220, 'sawtooth', 0.2, 0.2);
    }

    function playStageClearSound() {
      if (!soundEnabled) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((n, idx) => {
        setTimeout(() => playTone(n, 'triangle', 0.22, 0.3), idx * 120);
      });
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundIcon').className = soundEnabled ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark text-slate-400';
    }

    // CATEGORIES DATA
    const CATEGORIES = [
      { id: 1, name: "1. 大きさ比べ", sub: "Size Comparison", icon: "🦒", color: "from-rose-400 to-pink-500", stages: ["長さ (Length)", "面積 (Area)", "体積 (Volume)"] },
      { id: 2, name: "2. 長さの単位", sub: "Length Units", icon: "📏", color: "from-amber-400 to-orange-500", stages: ["センチメートル (cm)", "メートル (m)", "ミリメートル (mm)"] },
      { id: 3, name: "3. 体積の単位", sub: "Volume Units", icon: "🥛", color: "from-emerald-400 to-teal-600", stages: ["リットル (L)", "デシリットル (dL)", "ミリメートル (mL)"] },
      { id: 4, name: "4. 重さの単位", sub: "Weight Units", icon: "⚖️", color: "from-sky-400 to-blue-600", stages: ["グラム (g)", "キログラム (kg)"] },
      { id: 5, name: "5. 時計の読み方", sub: "Telling Time", icon: "⏰", color: "from-indigo-500 to-purple-600", stages: ["デジタル時計 (Digital)", "アナログ時計 (Analog)"] },
      { id: 6, name: "6. 三角形・四角形", sub: "Shapes & Types", icon: "🔷", color: "from-fuchsia-500 to-pink-600", stages: ["仲間分け (Sorting)", "特殊な図形 (Special)"] },
      { id: 7, name: "7. 角 (かど)", sub: "Corners of Shapes", icon: "📐", color: "from-rose-500 to-red-600", stages: ["角をさがそう (Corners)"] },
      { id: 8, name: "8. 円と球の要素", sub: "Circle & Sphere", icon: "🔴", color: "from-amber-500 to-yellow-600", stages: ["中心・半径・直径", "半径と直径の計算"] },
      { id: 9, name: "9. 角の大きさ", sub: "Angles & Degrees", icon: "🏹", color: "from-teal-500 to-emerald-700", stages: ["角度比べ", "直角・180°・360°", "多角形の角"] },
      { id: 10, name: "10. 面積の単位", sub: "Area Units", icon: "🗺️", color: "from-blue-500 to-indigo-700", stages: ["面積の単位"] },
      { id: 11, name: "11. 四角形の面積", sub: "Area: Square & Rectangle", icon: "⬛", color: "from-purple-500 to-indigo-800", stages: ["長方形の面積", "正方形の面積"] },
      { id: 12, name: "12. 三角形・平行四辺形", sub: "Shear Area Transformation", icon: "✂️", color: "from-pink-500 to-rose-700", stages: ["変形と面積 (Transformation)"] }
    ];

    // State Variables
    let currentCategoryId = 1;
    let currentStageIndex = 0;
    let currentQuestionIdx = 0;
    let quizScore = 0;
    let questionsList = [];
    let globalStarsCount = 0;
    let keyInputValue = "";
    let selectedCornerCount = 0;
    let targetCornerCount = 0;

    function renderCategoryMenu() {
      const container = document.querySelector('#categoryMenu .grid');
      container.innerHTML = '';

      CATEGORIES.forEach(cat => {
        const card = document.createElement('div');
        card.className = `bg-gradient-to-br ${cat.color} text-white rounded-3xl p-5 cursor-pointer card-shadow hover:scale-105 transition transform relative overflow-hidden`;
        card.onclick = () => selectCategory(cat.id);

        card.innerHTML = `
          <div class="flex justify-between items-start mb-3">
            <span class="bg-white/20 px-3 py-1 rounded-full font-bold text-xs tracking-wider">TOPIC ${cat.id}</span>
            <span class="text-3xl">${cat.icon}</span>
          </div>
          <h2 class="text-xl font-black mb-1">${cat.name}</h2>
          <p class="text-xs text-white/80">${cat.sub}</p>
          <div class="mt-4 bg-black/20 p-2 rounded-xl flex justify-between items-center text-xs">
            <span>${cat.stages.length} Stages</span>
            <i class="fa-solid fa-circle-play text-amber-300 text-lg"></i>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function showCategoryMenu() {
      document.getElementById('categoryMenu').classList.remove('hidden');
      document.getElementById('stageSelectScreen').classList.add('hidden');
      document.getElementById('quizScreen').classList.add('hidden');
      document.getElementById('tutorialModal').classList.add('hidden');
    }

    function selectCategory(catId) {
      currentCategoryId = catId;
      const cat = CATEGORIES.find(c => c.id === catId);

      document.getElementById('categoryMenu').classList.add('hidden');
      document.getElementById('stageSelectScreen').classList.remove('hidden');
      document.getElementById('selectedCategoryTitle').innerText = `${cat.icon} ${cat.name}`;

      const btnContainer = document.getElementById('stageButtonsContainer');
      btnContainer.innerHTML = '';

      cat.stages.forEach((stgName, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-900 border-2 border-indigo-200 font-bold p-4 rounded-2xl flex items-center justify-between transition btn-bounce";
        btn.onclick = () => openStageTutorial(idx);
        btn.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-8 h-8 bg-indigo-600 text-white rounded-full flex items-center justify-center text-sm font-black">${idx + 1}</span>
            <span class="text-base">${stgName}</span>
          </div>
          <i class="fa-solid fa-chevron-right text-indigo-400"></i>
        `;
        btnContainer.appendChild(btn);
      });
    }

    function openStageTutorial(stageIdx) {
      currentStageIndex = stageIdx;
      document.getElementById('stageSelectScreen').classList.add('hidden');
      document.getElementById('tutorialModal').classList.remove('hidden');

      renderTutorialAnimation(currentCategoryId, currentStageIndex);
    }

    // ANIMATED TUTORIAL DEMOS BEFORE STAGE STARTS
    function renderTutorialAnimation(catId, stgIdx) {
      const animBox = document.getElementById('tutorialAnimBox');
      animBox.innerHTML = '';

      if (catId === 1) {
        if (stgIdx === 0) {
          animBox.innerHTML = `
            <div class="flex items-center justify-center gap-6 w-full">
              <div class="w-32 h-40 bg-white border-2 border-indigo-300 rounded-2xl flex items-end justify-center p-2 relative">
                <span class="text-4xl">🦒</span>
              </div>
              <div class="w-32 h-40 bg-white border-2 border-indigo-300 rounded-2xl flex items-end justify-center p-2 relative">
                <span class="text-7xl">🦒</span>
              </div>
              <div class="absolute right-12 bottom-4 text-5xl anim-hand" style="--dx:-30px; --dy:-10px;">👇</div>
            </div>
          `;
        } else if (stgIdx === 1) {
          animBox.innerHTML = `
            <div class="flex items-center justify-center gap-6 w-full">
              <div class="w-32 h-32 bg-white border-2 border-indigo-300 rounded-2xl flex items-center justify-center p-2">
                <svg width="60" height="70" viewBox="0 0 100 120" class="fill-emerald-400 stroke-emerald-700 stroke-2"><path d="M20 20 L80 10 L90 90 L10 100 Z"/></svg>
              </div>
              <div class="w-32 h-32 bg-white border-2 border-indigo-300 rounded-2xl flex items-center justify-center p-2">
                <svg width="100" height="110" viewBox="0 0 100 120" class="fill-emerald-500 stroke-emerald-800 stroke-2"><path d="M20 20 L80 10 L90 90 L10 100 Z"/></svg>
              </div>
              <div class="absolute right-10 bottom-6 text-5xl anim-hand" style="--dx:-20px; --dy:-10px;">👇</div>
            </div>
          `;
        } else {
          animBox.innerHTML = `
            <div class="flex items-center justify-center gap-6 w-full">
              <div class="w-32 h-32 bg-white border-2 border-indigo-300 rounded-2xl flex items-center justify-center">
                <svg width="60" height="60" viewBox="0 0 100 100">
                  <polygon points="30,20 70,20 85,35 45,35" fill="#a7f3d0"/>
                  <polygon points="30,20 45,35 45,80 30,65" fill="#34d399"/>
                  <polygon points="45,35 85,35 85,80 45,80" fill="#059669"/>
                </svg>
              </div>
              <div class="w-32 h-32 bg-white border-2 border-indigo-300 rounded-2xl flex items-center justify-center">
                <svg width="90" height="90" viewBox="0 0 100 100">
                  <polygon points="30,20 70,20 85,35 45,35" fill="#a7f3d0"/>
                  <polygon points="30,20 45,35 45,80 30,65" fill="#34d399"/>
                  <polygon points="45,35 85,35 85,80 45,80" fill="#059669"/>
                </svg>
              </div>
            </div>
          `;
        }
      } else if (catId === 5) {
        animBox.innerHTML = `
          <div class="flex flex-col items-center justify-center gap-3">
            <div class="text-4xl">⏰ 03:15</div>
            <div class="flex gap-2">
              <span class="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center font-bold text-xl">0</span>
              <span class="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center font-bold text-xl">3</span>
              <span class="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center font-bold text-xl">1</span>
              <span class="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center font-bold text-xl">5</span>
            </div>
            <div class="text-4xl anim-hand" style="--dx:-40px; --dy:-10px;">👇</div>
          </div>
        `;
      } else if (catId === 6) {
        animBox.innerHTML = `
          <div class="flex items-center justify-around w-full">
            <div class="w-24 h-24 bg-rose-100 border-2 border-rose-400 rounded-2xl flex flex-col items-center justify-center">
              <span class="text-2xl">🔺</span>
              <span class="text-xs font-bold text-rose-700">3辺</span>
            </div>
            <div class="w-24 h-24 bg-blue-100 border-2 border-blue-400 rounded-2xl flex flex-col items-center justify-center">
              <span class="text-2xl">🟦</span>
              <span class="text-xs font-bold text-blue-700">4辺</span>
            </div>
          </div>
        `;
      } else if (catId === 12) {
        animBox.innerHTML = `
          <div class="flex flex-col items-center justify-center">
            <div class="relative w-64 h-28 bg-emerald-200 border-2 border-emerald-600 rounded-lg overflow-hidden">
              <div class="absolute left-0 top-0 w-20 h-full bg-emerald-400 border-r-2 border-dashed border-emerald-700 anim-slide-cut"></div>
            </div>
            <p class="text-xs font-bold text-slate-600 mt-2">切って移動すると長方形になる！</p>
          </div>
        `;
      } else {
        animBox.innerHTML = `
          <div class="flex flex-col items-center justify-center gap-3">
            <div class="text-5xl">🎯</div>
            <div class="text-4xl anim-hand" style="--dx:0px; --dy:-20px;">👇</div>
          </div>
        `;
      }
    }

    function startActualQuiz() {
      document.getElementById('tutorialModal').classList.add('hidden');
      document.getElementById('quizScreen').classList.remove('hidden');
      document.getElementById('quizScreen').classList.add('flex');

      currentQuestionIdx = 0;
      quizScore = 0;
      generateQuestionPool(currentCategoryId, currentStageIndex);
      renderCurrentQuestion();
    }

    function exitQuizToStageSelect() {
      document.getElementById('quizScreen').classList.add('hidden');
      document.getElementById('stageSelectScreen').classList.remove('hidden');
    }

    // GENERATE RANDOMIZED 10 QUESTIONS PER STAGE (NO FALLBACK)
    function generateQuestionPool(catId, stgIdx) {
      questionsList = [];

      for (let i = 0; i < 10; i++) {
        if (catId === 1) { // Size comparison
          if (stgIdx === 0) { // Length
            const items = ['🦒 キリン', '🌳 木', '🐊 ワニ', '🐍 ヘビ', '📏 定規', '🥕 ニンジン'];
            const chosen = items[i % items.length];
            const biggerIndex = Math.random() < 0.5 ? 0 : 1;
            questionsList.push({ type: 'size_compare_fixed_frame', item: chosen, biggerIndex });
          } else if (stgIdx === 1) { // Area (Map real ratio Japan vs Laos & Food Area)
            if (i % 2 === 0) {
              const japanFirst = Math.random() < 0.5;
              questionsList.push({
                type: 'map_area_compare',
                item1: japanFirst ? '🇯🇵 日本' : '🇱🇦 ラオス',
                item2: japanFirst ? '🇱🇦 ラオス' : '🇯🇵 日本',
                area1: japanFirst ? 378 : 236,
                area2: japanFirst ? 236 : 378,
                ans: japanFirst ? 0 : 1
              });
            } else {
              const pizzaFirst = Math.random() < 0.5;
              questionsList.push({
                type: 'food_area_compare',
                size1: pizzaFirst ? 90 : 50,
                size2: pizzaFirst ? 50 : 90,
                ans: pizzaFirst ? 0 : 1
              });
            }
          } else { // Volume
            const biggerIndex = Math.random() < 0.5 ? 0 : 1;
            questionsList.push({ type: 'volume_3d_compare', biggerIndex });
          }
        }
        else if (catId === 2) { // Length units
          if (stgIdx === 0) { // cm ruler
            const lengthCm = (i % 8) + 2;
            questionsList.push({ type: 'ruler_length', cm: lengthCm, unit: 'cm' });
          } else if (stgIdx === 1) { // m & conversion
            if (i < 5) {
              const mVal = (i + 1);
              questionsList.push({ type: 'unit_choice', icon: '🧍', text: `身長 / 身の回り`, val: `${mVal}.5`, correct: 'm', options: ['cm', 'm', 'km'] });
            } else {
              const mVal = (i - 4) * 2;
              questionsList.push({ type: 'keypad_calc', prompt: `${mVal} m = [ ? ] cm`, answer: mVal * 100 });
            }
          } else { // mm & conversion
            if (i < 5) {
              const mmVal = (i + 1) * 2;
              questionsList.push({ type: 'ruler_length', cm: mmVal, unit: 'mm' });
            } else {
              const cmVal = (i - 4);
              questionsList.push({ type: 'keypad_calc', prompt: `${cmVal} cm = [ ? ] mm`, answer: cmVal * 10 });
            }
          }
        }
        else if (catId === 3) { // Volume units
          if (stgIdx === 0) {
            questionsList.push({ type: 'unit_choice', icon: '🥛 Milk', text: '牛乳パック', val: '1', correct: 'L', options: ['mL', 'dL', 'L'] });
          } else if (stgIdx === 1) {
            if (i < 5) {
              questionsList.push({ type: 'unit_choice', icon: '☕ Cup', text: 'コップ一杯', val: '2', correct: 'dL', options: ['mL', 'dL', 'L'] });
            } else {
              const lVal = i - 4;
              questionsList.push({ type: 'keypad_calc', prompt: `${lVal} L = [ ? ] dL`, answer: lVal * 10 });
            }
          } else {
            if (i < 5) {
              questionsList.push({ type: 'unit_choice', icon: '🧃 Juice', text: '小さなカップ', val: '200', correct: 'mL', options: ['mL', 'dL', 'L'] });
            } else {
              const dlVal = i - 4;
              questionsList.push({ type: 'keypad_calc', prompt: `${dlVal} dL = [ ? ] mL`, answer: dlVal * 100 });
            }
          }
        }
        else if (catId === 4) { // Weight units
          if (stgIdx === 0) { // Flour scale
            const flourWeight = (i + 1) * 100;
            questionsList.push({ type: 'flour_scale', weight: flourWeight });
          } else { // kg & conversion
            if (i < 5) {
              const kgVal = (i + 2) * 10;
              questionsList.push({ type: 'unit_choice', icon: '🧍 Person', text: '人の体重', val: `${kgVal}`, correct: 'kg', options: ['g', 'kg'] });
            } else {
              const kgVal = (i - 4);
              questionsList.push({ type: 'keypad_calc', prompt: `${kgVal} kg = [ ? ] g`, answer: kgVal * 1000 });
            }
          }
        }
        else if (catId === 5) { // Clock
          const hour = (i % 12) + 1;
          const minute = (i * 10) % 60;
          if (stgIdx === 0) {
            questionsList.push({ type: 'digital_clock', hour, minute });
          } else {
            questionsList.push({ type: 'analog_clock', hour, minute });
          }
        }
        else if (catId === 6) { // Shapes
          if (stgIdx === 0) {
            questionsList.push({ type: 'drag_sort_shapes' });
          } else {
            questionsList.push({ type: 'select_special_shape', isSquareTarget: i < 5 });
          }
        }
        else if (catId === 7) { // Corners
          const corners = (i % 4) + 3; // 3, 4, 5 corners
          questionsList.push({ type: 'corner_tap', cornerCount: corners });
        }
        else if (catId === 8) { // Circle / Sphere
          if (stgIdx === 0) {
            const parts = [
              { name: '中心', desc: '真ん中の点' },
              { name: '半径', desc: '中心から端までの長さ' },
              { name: '直径', desc: '中心を通る端から端までの長さ' }
            ];
            const target = parts[i % 3];
            questionsList.push({ type: 'circle_part_id', targetPart: target.name, options: ['中心', '半径', '直径'] });
          } else {
            const radius = (i + 1) * 3;
            if (i < 5) {
              questionsList.push({ type: 'keypad_calc', prompt: `半径 = ${radius} cm ➔ 直径 = [ ? ] cm`, answer: radius * 2 });
            } else {
              questionsList.push({ type: 'keypad_calc', prompt: `直径 = ${radius * 2} cm ➔ 半径 = [ ? ] cm`, answer: radius });
            }
          }
        }
        else if (catId === 9) { // Angle size
          if (stgIdx === 0) { // Angle comparison
            const deg1 = 30 + (i * 4);
            const deg2 = 75 + (i * 3);
            questionsList.push({ type: 'compare_angles', deg1, deg2, ans: deg2 > deg1 ? 1 : 0 });
          } else if (stgIdx === 1) { // Right / 180 / 360
            const angles = [
              { label: '直角 (Right Angle)', deg: 90 },
              { label: '直線 (Straight Angle)', deg: 180 },
              { label: '一回転 (Full Circle)', deg: 360 }
            ];
            const target = angles[i % 3];
            questionsList.push({ type: 'keypad_calc', prompt: `${target.label} = [ ? ] °`, answer: target.deg });
          } else {
            const polys = [
              { name: '三角形の内角の和', ans: 180 },
              { name: '四角形の内角の和', ans: 360 },
              { name: '五角形の内角の和', ans: 540 },
              { name: '六角形の内角の和', ans: 720 }
            ];
            const p = polys[i % polys.length];
            questionsList.push({ type: 'keypad_calc', prompt: `${p.name} = [ ? ] °`, answer: p.ans });
          }
        }
        else if (catId === 10) { // Area units
          const units = [
            { icon: '✉️ 切手', val: '1', correct: 'cm²' },
            { icon: '🏫 教室', val: '50', correct: 'm²' },
            { icon: '🌾 畑', val: '2', correct: 'a' },
            { icon: '🏙️ 街', val: '10', correct: 'km²' }
          ];
          const u = units[i % units.length];
          questionsList.push({ type: 'unit_choice', icon: u.icon, text: u.icon, val: u.val, correct: u.correct, options: ['cm²', 'm²', 'a', 'km²'] });
        }
        else if (catId === 11) { // Square/Rectangle area
          const w = (i % 4) + 3;
          const h = (i % 3) + 2;
          if (stgIdx === 0) {
            questionsList.push({ type: 'keypad_calc', prompt: `長方形 (${w}cm × ${h}cm) の面積 = [ ? ] cm²`, answer: w * h });
          } else {
            questionsList.push({ type: 'keypad_calc', prompt: `正方形 (一辺 ${w}cm) の面積 = [ ? ] cm²`, answer: w * w });
          }
        }
        else { // Parallelogram & triangle area
          const base = (i % 4) + 4;
          const height = (i % 3) + 3;
          if (i < 5) {
            questionsList.push({ type: 'keypad_calc', prompt: `平行四辺形 (底辺 ${base}cm, 高さ ${height}cm) = [ ? ] cm²`, answer: base * height });
          } else {
            questionsList.push({ type: 'keypad_calc', prompt: `三角形 (底辺 ${base}cm, 高さ ${height}cm) = [ ? ] cm²`, answer: (base * height) / 2 });
          }
        }
      }

      // Shuffle question list
      questionsList.sort(() => Math.random() - 0.5);
    }

    function updateProgressDots() {
      const container = document.getElementById('quizProgressDots');
      container.innerHTML = '';
      for (let i = 0; i < 10; i++) {
        const dot = document.createElement('div');
        dot.className = `w-4 h-4 rounded-full transition transform ${
          i === currentQuestionIdx ? 'bg-amber-400 scale-125 ring-2 ring-amber-300' :
          (i < currentQuestionIdx ? 'bg-emerald-500' : 'bg-slate-200')
        }`;
        container.appendChild(dot);
      }
      document.getElementById('currentQuizScore').innerText = `${quizScore}/10`;
    }

            <button onclick="checkAnswer(1, ${q.ans})" class="w-36 h-36 bg-white border-4 border-indigo-200 rounded-3xl flex items-center justify-center shadow-lg btn-bounce">
              <svg width="100" height="100" viewBox="0 0 100 100">
                <path d="M 20 80 L 80 80 M 20 80 L ${20 + 60*Math.cos(q.deg2*Math.PI/180)} ${80 - 60*Math.sin(q.deg2*Math.PI/180)}" stroke="#ff3b30" stroke-width="5"/>
              </svg>
            </button>
          </div>
        `;
      }
      // STAGE KEYPAD CALCULATION FALLBACK
      else if (q.type === 'keypad_calc') {
        box.innerHTML = `
          <div class="text-xl sm:text-2xl font-black text-indigo-900 mb-4 text-center">${q.prompt}</div>
          <div id="keypadDisplay" class="bg-white border-4 border-indigo-300 font-mono text-3xl font-black px-6 py-2 rounded-2xl min-w-[160px] text-center text-indigo-900 mb-4 shadow-inner">
            -
          </div>
          ${renderKeypadControls(q.answer)}
        `;
      }
      // UNIT CHOICE FALLBACK
      else if (q.type === 'unit_choice') {
        box.innerHTML = `
          <div class="text-6xl mb-2">${q.icon}</div>
          <div class="text-lg font-bold text-slate-600 mb-2">${q.text || ''}</div>
          <div class="text-3xl font-black bg-white px-8 py-3 rounded-2xl shadow border-2 border-indigo-100 mb-6">
            ${q.val} [ <span class="text-indigo-600 font-extrabold">?</span> ]
          </div>
          <div class="flex flex-wrap justify-center gap-3">
            ${q.options.map(opt => `
              <button onclick="checkAnswer('${opt}', '${q.correct}')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-2xl px-6 py-3 rounded-2xl shadow-lg btn-bounce">
                ${opt}
              </button>
            `).join('')}
          </div>
        `;
      }
    }

    // HELPER: Keypad UI with Backspace (⌫) and Clear (C)
    function renderKeypadControls(targetAns) {
      return `
        <div class="grid grid-cols-3 gap-2 w-full max-w-xs">
          ${[1,2,3,4,5,6,7,8,9].map(n => `
            <button onclick="pressKeypadDigit('${n}')" class="bg-slate-100 hover:bg-slate-200 text-indigo-950 font-black text-xl py-2.5 rounded-xl border border-slate-300 shadow btn-bounce">
              ${n}
            </button>
          `).join('')}
          <button onclick="backspaceKeypad()" class="bg-amber-100 text-amber-800 font-black text-lg py-2.5 rounded-xl border border-amber-300 btn-bounce">⌫</button>
          <button onclick="pressKeypadDigit('0')" class="bg-slate-100 hover:bg-slate-200 text-indigo-950 font-black text-xl py-2.5 rounded-xl border border-slate-300 shadow btn-bounce">0</button>
          <button onclick="clearKeypadDisplay()" class="bg-rose-100 text-rose-700 font-black text-lg py-2.5 rounded-xl border border-rose-300 btn-bounce">C</button>
          <button onclick="submitKeypadAnswer('${targetAns}')" class="col-span-3 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-xl py-3 rounded-xl shadow btn-bounce">
            OK (けってい)
          </button>
        </div>
      `;
    }

    // HELPER: Corner tap buttons Generator
    function renderPolygonCornerButtons(count) {
      if (count === 3) {
        return `
          <button onclick="tapCorner(this)" class="absolute top-3 left-1/2 -translate-x-1/2 w-8 h-8 bg-amber-400 rounded-full border-2 border-white shadow btn-bounce"></button>
          <button onclick="tapCorner(this)" class="absolute bottom-6 left-5 w-8 h-8 bg-amber-400 rounded-full border-2 border-white shadow btn-bounce"></button>
          <button onclick="tapCorner(this)" class="absolute bottom-6 right-5 w-8 h-8 bg-amber-400 rounded-full border-2 border-white shadow btn-bounce"></button>
        `;
      } else if (count === 4) {
        return `
          <button onclick="tapCorner(this)" class="absolute top-6 left-6 w-8 h-8 bg-amber-400 rounded-full border-2 border-white shadow btn-bounce"></button>
          <button onclick="tapCorner(this)" class="absolute top-6 right-6 w-8 h-8 bg-amber-400 rounded-full border-2 border-white shadow btn-bounce"></button>
          <button onclick="tapCorner(this)" class="absolute bottom-6 left-6 w-8 h-8 bg-amber-400 rounded-full border-2 border-white shadow btn-bounce"></button>
          <button onclick="tapCorner(this)" class="absolute bottom-6 right-6 w-8 h-8 bg-amber-400 rounded-full border-2 border-white shadow btn-bounce"></button>
        `;
      } else {
        return `
          <button onclick="tapCorner(this)" class="absolute top-2 left-1/2 -translate-x-1/2 w-8 h-8 bg-amber-400 rounded-full border-2 border-white shadow btn-bounce"></button>
          <button onclick="tapCorner(this)" class="absolute top-10 left-3 w-8 h-8 bg-amber-400 rounded-full border-2 border-white shadow btn-bounce"></button>
          <button onclick="tapCorner(this)" class="absolute top-10 right-3 w-8 h-8 bg-amber-400 rounded-full border-2 border-white shadow btn-bounce"></button>
          <button onclick="tapCorner(this)" class="absolute bottom-5 left-7 w-8 h-8 bg-amber-400 rounded-full border-2 border-white shadow btn-bounce"></button>
          <button onclick="tapCorner(this)" class="absolute bottom-5 right-7 w-8 h-8 bg-amber-400 rounded-full border-2 border-white shadow btn-bounce"></button>
        `;
      }
    }

    // KEYPAD HELPERS
    function pressKeypadDigit(digit) {
      playSoundClick();
      if (keyInputValue.length < 6) {
        keyInputValue += digit;
        document.getElementById('keypadDisplay').innerText = keyInputValue;
      }
    }

    function backspaceKeypad() {
      playSoundClick();
      keyInputValue = keyInputValue.slice(0, -1);
      document.getElementById('keypadDisplay').innerText = keyInputValue || "-";
    }

    function clearKeypadDisplay() {
      playSoundClick();
      keyInputValue = "";
      document.getElementById('keypadDisplay').innerText = "-";
    }

    function playSoundClick() {
      playTone(400, 'sine', 0.05, 0.1);
    }

    function submitKeypadAnswer(targetAns) {
      checkAnswer(keyInputValue, targetAns);
    }

    function sortShapeToBin(type) {
      checkAnswer(type, 'triangle');
    }

    function tapCorner(btn) {
      btn.style.backgroundColor = '#10b981';
      btn.disabled = true;
      selectedCornerCount++;
      playTone(600 + selectedCornerCount * 100);
      if (selectedCornerCount >= targetCornerCount) {
        setTimeout(() => checkAnswer(selectedCornerCount, targetCornerCount), 300);
      }
    }

    // CHECK ANSWER LOGIC
    function checkAnswer(userVal, correctVal) {
      if (String(userVal).trim() === String(correctVal).trim()) {
        playCorrectSound();
        quizScore++;
      } else {
        playWrongSound();
      }

      currentQuestionIdx++;

      if (currentQuestionIdx < 10) {
        renderCurrentQuestion();
      } else {
        finishStageQuiz();
      }
    }

    function finishStageQuiz() {
      playStageClearSound();
      confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });

      globalStarsCount += Math.floor(quizScore / 3);
      document.getElementById('globalStars').innerText = globalStarsCount;

      const box = document.getElementById('questionContainer');
      box.innerHTML = `
        <div class="flex flex-col items-center justify-center py-4">
          <div class="text-7xl animate-bounce mb-3">⭐</div>
          <div class="text-3xl font-black text-indigo-950 mb-2">STAGE CLEAR!</div>
          <div class="text-xl font-bold text-slate-600 mb-6">Score: ${quizScore} / 10</div>
          <button onclick="exitQuizToStageSelect()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xl px-8 py-3.5 rounded-2xl shadow-lg btn-bounce">
            つぎへ (CONTINUE)
          </button>
        </div>
      `;
    }

    window.onload = () => {
      renderCategoryMenu();
    };
  </script>
</body>
</html>
